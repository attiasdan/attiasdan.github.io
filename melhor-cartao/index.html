<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Melhor Cartão do Dia</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    label { display: block; margin-top: 10px; }
    input { margin-top: 4px; padding: 4px; }
    button { margin-top: 12px; padding: 6px 10px; }
    .card-list { margin-top: 20px; }
    .card-item { border-bottom: 1px solid #ccc; padding: 6px 0; }
    .best-card { margin-top: 20px; font-weight: bold; font-size: 18px; }
  </style>
</head>
<body>
  <h1>Melhor Cartão do Dia</h1>

  <div>
    <h2>Cadastrar cartão</h2>
    <label>
      Nome do cartão:
      <input type="text" id="cardName">
    </label>
    <label>
      Dia de fechamento (1-31):
      <input type="number" id="closingDay" min="1" max="31">
    </label>
    <label>
      Dia de vencimento (1-31):
      <input type="number" id="dueDay" min="1" max="31">
    </label>
    <button id="addCardBtn">Salvar cartão</button>
  </div>

  <div class="card-list">
    <h2>Cartões cadastrados</h2>
    <div id="cardsContainer"></div>
  </div>

  <div class="best-card" id="bestCardToday"></div>

  <script>
    const STORAGE_KEY = 'meus_cartoes';

    function loadCards() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return [];
      try {
        return JSON.parse(data);
      } catch (e) {
        console.error('Erro ao ler cartões do localStorage', e);
        return [];
      }
    }

    function saveCards(cards) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
    }

    function isGoodDayForCard(card, date) {
      const day = date.getDate();
      const closingDay = Number(card.closingDay);
      const dueDay = Number(card.dueDay);

      if (closingDay < dueDay) {
        return day >= closingDay && day <= dueDay;
      } else if (closingDay > dueDay) {
        return day >= closingDay || day <= dueDay;
      } else {
        return false;
      }
    }

    function getBestCardForToday(cards, date) {
      for (const card of cards) {
        if (isGoodDayForCard(card, date)) {
          return card;
        }
      }
      return null;
    }

    function renderCards(cards) {
      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      if (cards.length === 0) {
        container.textContent = 'Nenhum cartão cadastrado.';
        return;
      }

      cards.forEach((card, index) => {
        const div = document.createElement('div');
        div.className = 'card-item';
        div.textContent = `${card.name} — Fecha: ${card.closingDay} | Vence: ${card.dueDay}`;

        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remover';
        removeBtn.style.marginLeft = '10px';
        removeBtn.onclick = () => {
          cards.splice(index, 1);
          saveCards(cards);
          renderCards(cards);
          renderBestCard(cards);
        };

        div.appendChild(removeBtn);
        container.appendChild(div);
      });
    }

    function renderBestCard(cards) {
      const today = new Date();
      const bestCard = getBestCardForToday(cards, today);
      const div = document.getElementById('bestCardToday');

      if (!cards.length) {
        div.textContent = '';
        return;
      }

      if (bestCard) {
        div.textContent = `Hoje (${today.getDate()}/${today.getMonth() + 1}) o melhor cartão é: ${bestCard.name}`;
      } else {
        div.textContent = `Hoje (${today.getDate()}/${today.getMonth() + 1}) nenhum cartão está no período ideal.`;
      }
    }

    document.getElementById('addCardBtn').addEventListener('click', () => {
      const name = document.getElementById('cardName').value.trim();
      const closingDay = document.getElementById('closingDay').value;
      const dueDay = document.getElementById('dueDay').value;

      if (!name || !closingDay || !dueDay) {
        alert('Preencha todos os campos.');
        return;
      }

      const closing = Number(closingDay);
      const due = Number(dueDay);

      if (closing < 1 || closing > 31 || due < 1 || due > 31) {
        alert('Dias devem estar entre 1 e 31.');
        return;
      }

      const cards = loadCards();
      cards.push({ name, closingDay: closing, dueDay: due });
      saveCards(cards);
      renderCards(cards);
      renderBestCard(cards);

      document.getElementById('cardName').value = '';
      document.getElementById('closingDay').value = '';
      document.getElementById('dueDay').value = '';
    });

    const initialCards = loadCards();
    renderCards(initialCards);
    renderBestCard(initialCards);
  </script>
</body>
</html>
